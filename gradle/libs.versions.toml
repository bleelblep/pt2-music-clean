[versions]
androidGradlePlugin = "9.2.1"
kotlin = "2.3.21"
compose = "1.11.2"
lifecycle = "2.10.0"
material3 = "1.5.0-alpha20"
media3 = "1.10.1"
androidxMedia = "1.7.1"
ktor = "3.5.0"
coil = "3.4.0"
coroutinesGuava = "1.11.0"
coroutines = "1.10.2"
activity = "1.13.0"
brotli = "0.1.2"
desugaring = "2.1.5"
junit = "4.13.2"
timber = "5.0.1"
kotlinxCollectionsImmutable = "0.5.0"
smoothCornerRectAndroidCompose = "v1.0.0"
composeMaterialIcons = "1.7.8"
coil2 = "2.7.0"
androidxCoreKtx = "1.19.0"
mdcMaterial = "1.14.0"
pebblekit = "1.2.0"
pipepipe = "aa72c97627"
okhttp = "5.4.0"

[libraries]
gradle = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }

compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-util = { module = "androidx.compose.ui:ui-util", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-animation = { module = "androidx.compose.animation:animation-graphics", version.ref = "compose" }

viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }

coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil2-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil2" }

media3 = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media = { module = "androidx.media:media", version.ref = "androidxMedia" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutinesGuava" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

brotli = { module = "org.brotli:dec", version.ref = "brotli" }

desugaring = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugaring" }

junit = { module = "junit:junit", version.ref = "junit" }

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
smooth-corner-rect = { module = "com.github.racra:smooth-corner-rect-android-compose", version.ref = "smoothCornerRectAndroidCompose" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "composeMaterialIcons" }
compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts", version.ref = "compose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
mdc-material = { module = "com.google.android.material:material", version.ref = "mdcMaterial" }

pebblekit-client = { module = "io.rebble.pebblekit2:client", version.ref = "pebblekit" }
# InfinityLoop1308/PipePipeExtractor @ v5.2.5 bump commit (2026-08-07): includes the
# "default anonymous client to visionos" + session PoToken fixes. MetrolistExtractor
# was considered and rejected - its last upstream merge is 2026-06-22, older than the
# maxrave pin it replaced. Multi-module repo, so the coordinate uses the repo name in
# the group and the module ("extractor") as the artifact.
pipepipe-extractor = { module = "com.github.InfinityLoop1308.PipePipeExtractor:extractor", version.ref = "pipepipe" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

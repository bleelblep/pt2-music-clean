<?xml version="1.0" encoding="UTF-8"?>
<!--
  Dreamwave mascot, designed for Pebble's 80 px illustration grid.
  Primary outlines: 4 px on whole-pixel paths.
  Detail lines: 2 px on whole-pixel paths.
  Slopes are limited to horizontal, vertical, 1:1, 2:1, 3:1 and reciprocals.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Tail, behind body. -->
  <path d="M18 48 L6 54 L18 60 L24 54 Z"
        fill="#ffffff" stroke="#000000" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main pony body and neck: closed focal shape with solid white fill. -->
  <path d="M16 52 L32 44 L32 24 L26 18 L30 6 L42 18 L48 24 L62 24
           L70 32 L70 46 L62 54 L58 54 L58 76 L16 76 Z"
        fill="#ffffff" stroke="#000000" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head and jaw. -->
  <path d="M42 24 L48 12 L60 8 L72 20 L68 24 Z"
        fill="#ffffff" stroke="#000000" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Unicorn horn, 1:2 sides. -->
  <path d="M52 12 L56 0 L60 12 Z"
        fill="#ffffff" stroke="#000000" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Geometric wave-shaped mane. -->
  <path d="M32 28 L24 32 L32 40 L24 44 L32 52"
        fill="none" stroke="#000000" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pixel-aligned eyes and smile detail. -->
  <path d="M52 32 V40 M62 32 V40"
        fill="none" stroke="#000000" stroke-width="4"
        stroke-linecap="round"/>
  <path d="M48 46 L54 52 L60 46"
        fill="none" stroke="#000000" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
